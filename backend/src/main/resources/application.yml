spring:
  application:
    name: Abanyabiraka
  # Reads KEY=VALUE pairs from backend/.env (gitignored) so secrets like MAIL_PASSWORD stay out of git.
  config:
    import: optional:file:.env[.properties]
  # Gmail SMTP for OTP emails. MAIL_USERNAME = the Gmail address, MAIL_PASSWORD = a Google App Password.
  # Leave them empty and codes are only written to the log (fine for local development).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    # Either set DB_URL (full JDBC URL), or DB_HOST/DB_PORT/DB_NAME (what Render's database provides).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abanyabiraka}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  # Hosting platforms (Render) assign the port through $PORT.
  port: ${PORT:8080}

jwt:
  # No default on purpose: the app refuses to start without JWT_SECRET (set it in backend/.env locally).
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  name: Abanyabiraka
  mail:
    # Address OTP emails come from. With Brevo it must be a verified sender in your Brevo account.
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    # Brevo (brevo.com) sends over HTTPS, which works on hosts that block SMTP (Render's free plan).
    # When set, it is used instead of SMTP. Free tier: 300 emails/day.
    brevo-api-key: ${BREVO_API_KEY:}
  # Optional: on startup, create this admin account (or promote it if the email already exists).
  # Nobody can sign up as ADMIN, so this is how the first admin gets in. Password: 8+ characters.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Admin}
  upload-dir: ${UPLOAD_DIR:uploads}
  # Comma-separated frontend origins allowed to call the API, e.g. https://abanyabiraka-web.onrender.com
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: Abanyabiraka
  # Reads KEY=VALUE pairs from backend/.env (gitignored) so secrets like MAIL_PASSWORD stay out of git.
  config:
    import: optional:file:.env[.properties]
  # Gmail SMTP for OTP emails. MAIL_USERNAME = the Gmail address, MAIL_PASSWORD = a Google App Password.
  # Leave them empty and codes are only written to the log (fine for local development).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Abanyabiraka}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:abanyabiraka-dev-secret-key-change-me-in-production-2026}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  name: Abanyabiraka
  upload-dir: uploads

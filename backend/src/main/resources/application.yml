spring:
  application:
    name: Abanyabiraka
  datasource:
    url: jdbc:postgresql://localhost:5432/Abanyabiraka
    username:
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080

jwt:
  secret: "abanyabiraka-dev-secret-key-change-me-in-production-2026"
  expiration-ms: 86400000

app:
  name: Abanyabiraka
  upload-dir: uploads

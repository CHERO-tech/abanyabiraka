# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Creates the database, the Spring Boot API (Docker) and the Next.js frontend.
# Values marked "sync: false" are asked for in the dashboard during setup; they are never stored in git.

databases:
  - name: abanyabiraka-db
    databaseName: abanyabiraka
    user: abanyabiraka
    plan: free            # free databases expire after 30 days; switch to basic-256mb for real use
    region: frankfurt     # closest Render region to Rwanda

services:
  # ---------- Backend: Spring Boot API ----------
  - type: web
    name: abanyabiraka-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter         # persistent disks need a paid plan; on "free", uploaded files vanish on redeploy
    region: frankfurt
    branch: main
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DB_HOST
        fromDatabase: { name: abanyabiraka-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: abanyabiraka-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: abanyabiraka-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: abanyabiraka-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: abanyabiraka-db, property: password }
      - key: JWT_SECRET
        generateValue: true          # Render generates a random production secret
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75"
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # e.g. https://abanyabiraka-web.onrender.com
      - key: MAIL_USERNAME
        sync: false                  # project Gmail address (leave empty to log codes instead)
      - key: MAIL_PASSWORD
        sync: false                  # Google App Password for that Gmail

  # ---------- Frontend: Next.js ----------
  - type: web
    name: abanyabiraka-web
    runtime: node
    rootDir: frontend
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false                  # e.g. https://abanyabiraka-api.onrender.com/api (baked in at build time)
